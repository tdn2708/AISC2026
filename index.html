<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: dùng cả vùng tai thỏ; khoảng an toàn do CSS env(safe-area-inset-*) lo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Customer Radar — phân tích phản hồi khách hàng đa kênh có tầng kiểm soát tin cậy dữ liệu. Đội LDS, Trường ĐH Công nghệ Thông tin – ĐHQG-HCM." />
    <!-- Màu thanh trạng thái/thanh địa chỉ trên điện thoại; useTheme cập nhật khi đổi theme -->
    <meta name="theme-color" content="#F4F6F9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Customer Radar</title>
    <script>
      // Áp theme đã lưu TRƯỚC khi React chạy, để không nháy nền sai màu
      try {
        var t = localStorage.getItem('cr-theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#0D1524' : '#F4F6F9');
        if (localStorage.getItem('cr-glass') === 'off') document.documentElement.setAttribute('data-glass', 'off');
      } catch (e) {}
    </script>
    <style>
      body { background-color: #F4F6F9; margin: 0; font-family: 'Inter', system-ui, sans-serif; }
      [data-theme='dark'] body { background-color: #0D1524; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:36rem;margin:4rem auto;padding:0 1rem;font-family:system-ui,sans-serif;color:#13233F">
        <h1 style="font-size:1.6rem">Customer Radar</h1>
        <p>Đọc hết phản hồi khách, chỉ tin con số có chứng từ. Trang này cần bật JavaScript để hiện số liệu và bản dùng thử.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
